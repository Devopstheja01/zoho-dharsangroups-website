[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
  
# Ensure images are included
[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200
